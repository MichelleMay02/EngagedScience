<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Quality Data</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #ffffff;
    }

    h2 {
      margin-bottom: 12px;
    }

    #sheet-buttons {
      margin-bottom: 16px;
    }

    button {
      padding: 8px 14px;
      margin: 0 6px 6px 0;
      cursor: pointer;
      border: 1px solid #bbb;
      background: #f5f5f5;
      border-radius: 4px;
    }

    button:hover {
      background: #e9e9e9;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f2f2f2;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    #status {
      margin: 10px 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h2>Water Quality Data</h2>

  <div id="sheet-buttons"></div>
  <div id="status">Loading workbook...</div>

  <div class="table-wrapper">
    <div id="spreadsheet"></div>
  </div>

  <script>
    const excelFile = "water_quality.xlsx";

    fetch(excelFile)
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load Excel file.");
        }
        return response.arrayBuffer();
      })
      .then(data => {
        const workbook = XLSX.read(data, { type: "array" });

        const buttons = document.getElementById("sheet-buttons");
        const status = document.getElementById("status");

        function displaySheet(sheetName) {
          const sheet = workbook.Sheets[sheetName];

          const html = XLSX.utils.sheet_to_html(sheet, {
            id: "excel-table"
          });

          document.getElementById("spreadsheet").innerHTML = html;
          status.textContent = "Showing: " + sheetName;
        }

        workbook.SheetNames.forEach(sheetName => {
          const button = document.createElement("button");
          button.textContent = sheetName;

          button.addEventListener("click", () => {
            displaySheet(sheetName);
          });

          buttons.appendChild(button);
        });

        if (workbook.SheetNames.length > 0) {
          displaySheet(workbook.SheetNames[0]);
        } else {
          status.textContent = "No worksheets found.";
        }
      })
      .catch(error => {
        console.error(error);
        document.getElementById("status").textContent =
          "Unable to load water_quality.xlsx";
      });
  </script>

</body>
</html>
